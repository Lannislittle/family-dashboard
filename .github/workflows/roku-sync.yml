name: Roku Dashboard Cloud Sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install puppeteer node-fetch

    - name: Run Cloud Sync
      env:
        GPHOTOS_CLIENT_ID: ${{ secrets.GPHOTOS_CLIENT_ID }}
        GPHOTOS_CLIENT_SECRET: ${{ secrets.GPHOTOS_CLIENT_SECRET }}
        GPHOTOS_REFRESH_TOKEN: ${{ secrets.GPHOTOS_REFRESH_TOKEN }}
        GPHOTOS_ALBUM_ID: ${{ secrets.GPHOTOS_ALBUM_ID }}
      run: node cloud-sync.js
